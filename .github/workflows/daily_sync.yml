name: Daily Cafe Column Sync Pipeline

on:
  schedule:
    # 한국 시간 기준 주기적 자동 실행 (1일 2회 분산 발행 보장 및 GitHub Actions 큐 지연 누락 방지)
    # 01:15 UTC (10:15 KST) / 05:15 UTC (14:15 KST) / 08:15 UTC (17:15 KST) / 12:15 UTC (21:15 KST)
    - cron: '15 1,5,8,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run sync pipeline (1일 1건 순차 발행 및 소진 시 일 2회 신규 글 감지)
        run: |
          python scripts/sync_pipeline.py 1
