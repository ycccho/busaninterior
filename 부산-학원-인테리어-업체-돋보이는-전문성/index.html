<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지 이동 안내 | 부산 병원 인테리어 전문 업체</title>
  
  <!-- SEO Canonical Tag pointing to the homepage or main relevant page to pass SEO ranking juice -->
  <link rel="canonical" href="https://busaninterior.kr/" />
  
  <!-- Meta Refresh Redirect (0 seconds) -->
  <meta http-equiv="refresh" content="0; url=https://busaninterior.kr/" />
  
  <script type="text/javascript">
    // Immediate redirect
    window.location.replace("https://busaninterior.kr/");
  </script>
</head>
<body>
  <p>이 페이지는 새로운 사이트로 이전되었습니다. 자동으로 메인 페이지로 이동합니다.</p>
  <p>이동하지 않는 경우 <a href="https://busaninterior.kr/">여기</a>를 클릭하세요.</p>
</body>
</html>
